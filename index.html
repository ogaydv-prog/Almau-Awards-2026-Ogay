<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMAU AWARDS 2026 | Огай Д.В.</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 24px 20px;
            position: relative;
        }

        /* Увеличенный логотип в левом верхнем углу */
        .top-left-logo {
            position: absolute;
            top: 22px;
            left: 28px;
            width: 74px;
            height: 74px;
            object-fit: contain;
            z-index: 100;
        }

        /* Аккуратный переключатель языков в правом верхнем углу */
        .top-right-lang {
            position: absolute;
            top: 26px;
            right: 28px;
            display: inline-flex;
            background: #f4f7fb;
            padding: 3px;
            border-radius: 9px;
            border: 1px solid #dce5f2;
            z-index: 100;
        }

        .lang-btn {
            border: none;
            background: transparent;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #526480;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: #00338D;
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(0, 51, 141, 0.2);
        }

        .lang-btn:hover:not(.active) {
            color: #00338D;
        }

        .header-container {
            width: 100%;
            max-width: 1260px;
            text-align: center;
            margin-top: 12px;
            margin-bottom: 84px; /* Опустили карточки ниже на ~2 см */
        }

        h1 {
            font-size: 34px;
            font-weight: 800;
            color: #C8102E;
            margin-bottom: 12px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 16px;
            color: #555555;
            max-width: 760px;
            line-height: 1.55;
            margin: 0 auto;
        }

        /* Сетка 5 карточек (+10% к размеру) */
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
            max-width: 1260px;
            width: 100%;
            justify-content: center;
            align-items: center;
            padding-bottom: 30px;
        }

        .card {
            display: block;
            text-decoration: none;
            background: #ffffff;
            border: 2px solid #00338D;
            border-radius: 17px;
            overflow: hidden;
            box-shadow: 0 5px 14px rgba(0, 51, 141, 0.10);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 222px;
            height: 293px;
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .card:hover {
            transform: translateY(-9px) scale(1.035);
            border-width: 3px;
            border-color: #00338D;
            box-shadow: 0 18px 36px rgba(0, 51, 141, 0.28), 0 0 0 3px rgba(0, 51, 141, 0.14);
        }

        .card:hover img {
            transform: scale(1.02);
            filter: brightness(1.04) contrast(1.02);
        }

        footer {
            margin-top: auto;
            font-size: 13.5px;
            color: #8a94a6;
            padding-top: 32px;
            padding-bottom: 16px;
            text-align: center;
            line-height: 1.6;
            width: 100%;
            letter-spacing: 0.2px;
        }

        /* АДАПТАЦИЯ ДЛЯ ПЛАНШЕТОВ И СМАРТФОНОВ */
        @media (max-width: 960px) {
            .top-bar-mobile {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                margin-bottom: 14px;
            }
            .top-left-logo {
                position: static;
                width: 62px;
                height: 62px;
            }
            .top-right-lang {
                position: static;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 14px 12px;
            }

            .header-container {
                margin-top: 4px;
                margin-bottom: 44px;
            }

            h1 {
                font-size: clamp(22px, 6.2vw, 28px);
                margin-bottom: 8px;
            }

            .subtitle {
                font-size: 13.5px;
                line-height: 1.45;
                padding: 0 6px;
            }

            .grid-container {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
                padding-bottom: 20px;
                max-width: 460px;
            }

            .card {
                width: 100%;
                height: auto;
                aspect-ratio: 222 / 293;
                border-radius: 14px;
            }

            /* 5-я карточка на мобильном аккуратно центрируется по ширине */
            .card:last-child {
                grid-column: 1 / -1;
                max-width: calc(50% - 7px);
                justify-self: center;
            }

            footer {
                font-size: 12px;
                padding-top: 20px;
                padding-bottom: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar-mobile">
        <!-- Увеличенный логотип AlmaU в левом верхнем углу -->
        <img src="almau.jpg" alt="AlmaU Logo" class="top-left-logo">

        <!-- Аккуратный переключатель языков в правом верхнем углу -->
        <div class="top-right-lang" role="group" aria-label="Language switcher">
            <button type="button" class="lang-btn" data-lang="kz">ҚАЗ</button>
            <button type="button" class="lang-btn active" data-lang="ru">РУС</button>
            <button type="button" class="lang-btn" data-lang="en">ENG</button>
        </div>
    </div>

    <header class="header-container">
        <h1>ALMAU AWARDS 2026</h1>
        <p class="subtitle" data-i18n="subtitle">
            Конкурсная заявка преподавателя Школы цифровых технологий и экономики Огай Д.В.<br>
            на номинацию «Лучший преподаватель»
        </p>
    </header>

    <main class="grid-container">
        <!-- 1. Meaningful -> сразу открывает meaningful.html -->
        <a href="meaningful.html" class="card" title="Meaningful — Ценность и связь с миссией">
            <img src="pic-meaning.png" alt="Meaningful">
        </a>

        <!-- 2. Educational -->
        <a href="courses.html" class="card" title="Educational — Развитие знаний и компетенций">
            <img src="pic-educational.png" alt="Educational">
        </a>

        <!-- 3. Stand Service -->
        <a href="stand-service.html" class="card" title="Stand Service — Качество опыта и процессов">
            <img src="pic-stand.png" alt="Stand Service">
        </a>

        <!-- 4. Impactful -->
        <a href="impactful.html" class="card" title="Impactful — Подтверждённое влияние">
            <img src="pic-impact.png" alt="Impactful">
        </a>

        <!-- 5. Financial Sustainability -->
        <a href="sustainability.html" class="card" title="Financial Sustainability — Устойчивость результата и ресурсов">
            <img src="pic-sustain.png" alt="Financial Sustainability">
        </a>
    </main>

    <footer>
        <p data-i18n="footerText">Огай Д.В. | Школа цифровых технологий и экономики | AlmaU 2026</p>
    </footer>

    <script>
        const translations = {
            ru: {
                subtitle: "Конкурсная заявка преподавателя Школы цифровых технологий и экономики Огай Д.В.<br>на номинацию «Лучший преподаватель»",
                footerText: "Огай Д.В. | Школа цифровых технологий и экономики | AlmaU 2026"
            },
            kz: {
                subtitle: "Цифрлық технологиялар және экономика мектебі оқытушысы Огай Д.В.-ның<br>«Үздік оқытушы» номинациясына конкурстық өтінімі",
                footerText: "Огай Д.В. | Цифрлық технологиялар және экономика мектебі | AlmaU 2026"
            },
            en: {
                subtitle: "Competition Application by D. Ogay, Faculty of the School of Digital Technologies and Economics,<br>for the «Best Teacher» Nomination",
                footerText: "D. Ogay | School of Digital Technologies and Economics | AlmaU 2026"
            }
        };

        function setLanguage(lang) {
            document.documentElement.lang = lang === 'kz' ? 'kk' : lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });
    </script>

</body>
</html>
