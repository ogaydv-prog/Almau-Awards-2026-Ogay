<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMAU AWARDS 2026 | Курсы — Огай Д.В.</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 22px 20px;
            position: relative;
        }

        /* Кнопка возврата в левом верхнем углу */
        .top-left-back {
            position: absolute;
            top: 24px;
            left: 28px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            background: #f4f7fb;
            color: #00338D;
            border: 1px solid #dce5f2;
            padding: 7px 14px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s ease;
            z-index: 100;
        }

        .top-left-back:hover {
            background: #00338D;
            color: #ffffff;
            border-color: #00338D;
        }

        /* Переключатель языков в правом верхнем углу */
        .top-right-lang {
            position: absolute;
            top: 24px;
            right: 28px;
            display: inline-flex;
            background: #f4f7fb;
            padding: 3px;
            border-radius: 9px;
            border: 1px solid #dce5f2;
            z-index: 100;
        }

        .lang-btn {
            border: none;
            background: transparent;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #526480;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: #00338D;
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(0, 51, 141, 0.2);
        }

        .lang-btn:hover:not(.active) {
            color: #00338D;
        }

        /* Шапка с логотипом AlmaU строго по центру */
        .header-container {
            width: 100%;
            max-width: 1440px;
            text-align: center;
            margin-top: 4px;
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .center-logo {
            width: 78px;
            height: 78px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #C8102E;
            margin-bottom: 8px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 15.5px;
            color: #555555;
            max-width: 740px;
            line-height: 1.5;
            margin: 0 auto;
        }

        /* Все 6 курсов в один ряд (221 x 293 px) */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(6, 221px);
            gap: 15px;
            max-width: 1440px;
            width: 100%;
            justify-content: center;
            align-items: center;
            margin-bottom: 36px;
        }

        .course-card {
            display: block;
            width: 221px;
            height: 293px;
            text-decoration: none;
            background: #ffffff;
            border: 2px solid #00338D;
            border-radius: 17px;
            overflow: hidden;
            box-shadow: 0 5px 14px rgba(0, 51, 141, 0.10);
            cursor: pointer;
            transition: all 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .course-card img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: fill;
            transition: transform 0.28s ease, filter 0.28s ease;
        }

        .course-card:hover {
            transform: translateY(-8px) scale(1.045);
            border-width: 4px;
            border-color: #00338D;
            box-shadow: 0 18px 36px rgba(0, 51, 141, 0.28), 0 0 0 4px rgba(0, 51, 141, 0.14);
        }

        .course-card:hover img {
            transform: scale(1.02);
            filter: brightness(1.04) contrast(1.02);
        }

        /* Нижний центральный блок GSB + Управленческая экономика */
        .mba-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            padding-top: 22px;
            border-top: 1.5px solid #c3d1e6;
            margin-bottom: 18px;
        }

        .gsb-logo {
            height: 70px;
            width: auto;
            max-width: 280px;
            object-fit: contain;
            margin-bottom: 14px;
            display: block;
        }

        footer {
            margin-top: auto;
            font-size: 13.5px;
            color: #8a94a6;
            padding-top: 24px;
            padding-bottom: 14px;
            text-align: center;
            line-height: 1.6;
            width: 100%;
            letter-spacing: 0.2px;
        }

        /* ПОЛНОЭКРАННЫЙ ПРОСМОТРЩИК + ПОЛНОСТЬЮ ПРОЗРАЧНАЯ КРУГЛАЯ ЗОНА ПОВЕРХ ГЕРБА ALMAU */
        .course-viewer {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 9999;
            display: none;
        }

        .course-viewer.open {
            display: block;
        }

        .logo-back-hotspot {
            position: fixed;
            top: 14px;
            left: 20px;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10000;
            transition: box-shadow 0.22s ease, transform 0.22s ease;
        }

        .logo-back-hotspot:hover {
            transform: scale(1.05);
            box-shadow: 0 0 0 3px rgba(0, 51, 141, 0.28);
        }

        .viewer-frame {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
            background: #ffffff;
        }

        /* АДАПТАЦИЯ ПОД ЭКРАНЫ РАЗНОЙ ШИРИНЫ */
        @media (max-width: 1440px) {
            .courses-grid {
                grid-template-columns: repeat(3, 221px);
                gap: 22px;
            }
        }

        @media (max-width: 960px) {
            .top-bar-mobile {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                margin-bottom: 12px;
            }
            .top-left-back,
            .top-right-lang {
                position: static;
            }
        }

        @media (max-width: 740px) {
            body {
                padding: 14px 12px;
            }

            .center-logo {
                width: 64px;
                height: 64px;
                margin-bottom: 8px;
            }

            h1 {
                font-size: clamp(22px, 6.2vw, 28px);
                margin-bottom: 8px;
            }

            .subtitle {
                font-size: 13.5px;
                padding: 0 6px;
            }

            .courses-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
                max-width: 460px;
                margin-bottom: 28px;
            }

            .course-card {
                width: 100%;
                height: auto;
                aspect-ratio: 221 / 293;
                border-radius: 14px;
            }

            .gsb-logo {
                height: 54px;
                margin-bottom: 10px;
            }

            .mba-section .course-card {
                width: calc(50% - 7px);
                max-width: 222px;
            }

            .logo-back-hotspot {
                top: 10px;
                left: 12px;
                width: 64px;
                height: 64px;
            }

            footer {
                font-size: 12px;
                padding-top: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar-mobile">
        <a href="index.html" class="top-left-back" data-i18n="backBtn">← Назад</a>

        <div class="top-right-lang" role="group" aria-label="Language switcher">
            <button type="button" class="lang-btn" data-lang="kz">ҚАЗ</button>
            <button type="button" class="lang-btn active" data-lang="ru">РУС</button>
            <button type="button" class="lang-btn" data-lang="en">ENG</button>
        </div>
    </div>

    <header class="header-container">
        <img src="almau.jpg" alt="AlmaU Logo" class="center-logo">
        <h1 data-i18n="pageTitle">КУРСЫ</h1>
        <p class="subtitle" data-i18n="subtitle">
            Авторские образовательные порталы и интерактивные симуляторы по экономическим дисциплинам
        </p>
    </header>

    <!-- Все 6 курсов бакалавриата в один ряд -->
    <main class="courses-grid">
        <a href="https://ogaydv-prog.github.io/Microeconomics-BA/" class="course-card" title="Микроэкономика" onclick="openCourse(event, this)">
            <img src="pic-micro.png" alt="Микроэкономика">
        </a>

        <a href="https://ogaydv-prog.github.io/Economics-se/" class="course-card" title="Economics" onclick="openCourse(event, this)">
            <img src="pic-economics.png" alt="Economics">
        </a>

        <a href="https://ogaydv-prog.github.io/Economics-rus/" class="course-card" title="Экономика" onclick="openCourse(event, this)">
            <img src="pic-econ-rus.png" alt="Экономика">
        </a>

        <a href="https://ogaydv-prog.github.io/principles-economics/" class="course-card" title="Principles of Economics" onclick="openCourse(event, this)">
            <img src="pic-pe.png" alt="Principles of Economics">
        </a>

        <a href="https://ogaydv-prog.github.io/Monetary-economics-almau/" class="course-card" title="Monetary Economics" onclick="openCourse(event, this)">
            <img src="pic-monetary.png" alt="Monetary Economics">
        </a>

        <a href="https://ogaydv-prog.github.io/Industrial-Economics/" class="course-card" title="Industrial Economics" onclick="openCourse(event, this)">
            <img src="pic-industial.png" alt="Industrial Economics">
        </a>
    </main>

    <!-- Отдельный центральный блок MBA: логотип GSB + Управленческая экономика -->
    <section class="mba-section" aria-label="MBA Course">
        <img src="gsb.png" alt="Graduate School of Business AlmaU" class="gsb-logo">
        <a href="https://ogaydv-prog.github.io/Managerial-Economics/" class="course-card" title="Управленческая экономика / Managerial Economics" onclick="openCourse(event, this)">
            <img src="pic-man-econ.png" alt="Управленческая экономика">
        </a>
    </section>

    <footer>
        <p data-i18n="footerText">Огай Д.В. | Школа цифровых технологий и экономики | AlmaU 2026</p>
    </footer>

    <!-- Полноэкранный просмотрщик: поверх герба AlmaU лежит прозрачная круглая кнопка возврата -->
    <div id="courseViewer" class="course-viewer" aria-hidden="true">
        <button type="button" id="logoBackBtn" class="logo-back-hotspot" onclick="closeCourse()" title="← К списку курсов" aria-label="К списку курсов"></button>
        <iframe id="viewerFrame" class="viewer-frame" src="about:blank" title="Course Portal"></iframe>
    </div>

    <script>
        const translations = {
            ru: {
                backBtn: "← Назад",
                pageTitle: "КУРСЫ",
                subtitle: "Авторские образовательные порталы и интерактивные симуляторы по экономическим дисциплинам",
                footerText: "Огай Д.В. | Школа цифровых технологий и экономики | AlmaU 2026",
                toCoursesTitle: "← К списку курсов"
            },
            kz: {
                backBtn: "← Артқа",
                pageTitle: "КУРСТАР",
                subtitle: "Экономикалық пәндер бойынша авторлық білім беру порталдары мен интерактивті симуляторлар",
                footerText: "Огай Д.В. | Цифрлық технологиялар және экономика мектебі | AlmaU 2026",
                toCoursesTitle: "← Курстар тізіміне"
            },
            en: {
                backBtn: "← Back",
                pageTitle: "COURSES",
                subtitle: "Author-designed educational portals and interactive simulators in economics",
                footerText: "D.Ogay | School of Digital Technologies and Economics | AlmaU 2026",
                toCoursesTitle: "← Back to courses"
            }
        };

        function setLanguage(lang) {
            document.documentElement.lang = lang === 'kz' ? 'kk' : lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });
            const logoBtn = document.getElementById('logoBackBtn');
            if (logoBtn && translations[lang]) {
                logoBtn.title = translations[lang].toCoursesTitle;
            }
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });

        function openCourse(e, link) {
            e.preventDefault();
            const url = link.getAttribute('href');
            document.getElementById('viewerFrame').src = url;
            document.getElementById('courseViewer').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeCourse() {
            document.getElementById('courseViewer').classList.remove('open');
            document.getElementById('viewerFrame').src = 'about:blank';
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeCourse();
        });
    </script>

</body>
</html>
